<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blog | Nilgiribytes — Stories from Our Oven</title>
  <link rel="icon" href="assets/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" href="assets/favicon-32x32.png">
  <link rel="icon" type="image/png" href="assets/favicon-48x48.png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <meta name="description" content="Baking tips, bakery stories, ingredient notes and recipes from Nilgiribytes.">
  <link rel="canonical" href="https://www.nilgibytes.com/blog.html" data-canonical>
  <meta property="og:type" content="website">
  <meta property="og:title" content="Blog | Nilgiribytes — Stories from Our Oven" data-og-title>
  <meta property="og:description" content="Baking tips, bakery stories, ingredient notes and recipes from Nilgiribytes."
    data-og-desc>
  <meta property="og:image" content="https://www.nilgibytes.com/assets/Craftsmanship.png" data-og-image>
  <meta property="og:image:alt" content="Golden bakes from the Nilgiribytes oven">
  <meta property="og:url" content="https://www.nilgibytes.com/blog.html" data-og-url>
  <meta property="og:site_name" content="Nilgiribytes">
  <meta property="og:locale" content="en_IN">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Blog | Nilgiribytes — Stories from Our Oven">
  <meta name="twitter:image" content="https://www.nilgibytes.com/assets/Craftsmanship.png">
  <script>
    /* Marks that JavaScript is available — see css/animations.css. */
    document.documentElement.classList.add("js");
    window.setTimeout(function () {
      if (!window.NILGIRI_MOTION_READY) {
        document.documentElement.classList.remove("js");
      }
    }, 2500);
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="css/animations.css">
</head>

<body data-page="blog">


  <!-- Shared header (fetched by js/main.js) -->
  <div data-include="header"></div>

  <main id="main-content">

    <!-- ===== List view (default) ===== -->
    <div id="blog-list-view">
      <section class="page-hero page-hero--blog" aria-labelledby="blog-title">
        <div class="page-hero_media" aria-hidden="true">
          <img src="assets/Craftsmanship.png" alt="" width="2000" height="1500" fetchpriority="high"
            data-remove-on-error>
        </div>
        <div class="page-hero_overlay" aria-hidden="true"></div>
        <div class="container page-hero_content">
          <span class="section-kicker">The blog</span>
          <h1 class="page-hero_title" id="blog-title">Stories from Our Oven.</h1>
          <p class="page-hero_text">Tips, tales and recipes from the bakery floor.
            <!-- Sample content: articles are placeholders until the bakery supplies real posts. -->
          </p>
          <ul class="page-hero_pills">
            <li>Baking Tips</li>
            <li>Bakery Stories</li>
            <li>Recipes</li>
          </ul>
        </div>
      </section>

      <section class="section" aria-labelledby="posts-heading">
        <div class="container">
          <h2 class="sr-only" id="posts-heading">Articles</h2>

          <div class="shop-toolbar reveal" data-reveal="fade-up">
            <div class="filter-chips" role="group" aria-label="Filter by category">
              <button class="chip" type="button" data-post-filter="All" aria-pressed="true">All</button>
              <button class="chip" type="button" data-post-filter="Baking Tips" aria-pressed="false">Baking
                Tips</button>
              <button class="chip" type="button" data-post-filter="Bakery Stories" aria-pressed="false">Bakery
                Stories</button>
              <button class="chip" type="button" data-post-filter="Ingredients"
                aria-pressed="false">Ingredients</button>
              <button class="chip" type="button" data-post-filter="Recipes" aria-pressed="false">Recipes</button>
              <button class="chip" type="button" data-post-filter="News" aria-pressed="false">News</button>
            </div>
            <div class="shop-controls">
              <div class="field">
                <label for="blog-search">Search</label>
                <input class="input" id="blog-search" type="search" placeholder="Search articles…" autocomplete="off">
              </div>
            </div>
          </div>

          <div id="blog-featured"></div>

          <div class="blog-grid mt-4" id="blog-grid">
            <noscript>
              <p class="empty-state">Enable JavaScript to read the blog.</p>
            </noscript>
          </div>
        </div>
      </section>
    </div>

    <!-- ===== Detail view (?slug=...) ===== -->
    <div id="blog-detail-view" hidden>
      <section class="section">
        <div class="container">
          <article class="article" id="article-root">
            <!-- Filled by js/blog.js -->
          </article>
        </div>
      </section>
    </div>

  </main>

  <!-- Shared footer (fetched by js/main.js) -->
  <div data-include="footer"></div>

  <script type="application/ld+json" id="article-jsonld"></script>
  <script src="js/main.js"></script>
  <script src="js/blog.js"></script>
  <script src="js/products.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/animations.js" defer></script>
</body>

</html>
