<!--
  header.html — shared site header, fetched into every page.
  Requires: <div data-include="header"></div> placeholder + js/main.js
-->
<a class="skip-link" href="#main-content">Skip to content</a>

<!-- Announcement bar (disabled — remove the comment markers to re-enable)
<div class="announcement" role="region" aria-label="Announcement">
  Freshly baked every morning · Free delivery on orders above ₹500 · Made in Ooty
</div>
-->

<header class="site-header">
  <div class="container site-header_inner">
    <a class="site-logo" href="index.html" aria-label="Nilgiribytes — Home">
      <img src="assets/nilgiribytes_header.png" alt="" width="200" height="200" data-logo-img>
      <span class="site-logo_name">Nilgiribytes</span>
    </a>

    <nav class="site-nav" id="site-nav" aria-label="Main navigation">
      <button class="icon-btn site-nav_close" type="button" data-nav-close aria-label="Close menu">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M18 6 6 18M6 6l12 12" />
        </svg>
      </button>
      <ul class="site-nav_list">
        <li><a class="site-nav_link" href="index.html" data-nav-link="index">Home</a></li>
        <li><a class="site-nav_link" href="shop.html" data-nav-link="shop">Shop</a></li>
        <li><a class="site-nav_link" href="about.html" data-nav-link="about">About</a></li>
        <li><a class="site-nav_link" href="blog.html" data-nav-link="blog">Blog</a></li>
      </ul>
    </nav>

    <div class="header-actions">
      <button class="icon-btn" type="button" data-search-toggle aria-expanded="false" aria-controls="header-search"
        aria-label="Search products">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="11" cy="11" r="7" />
          <path d="m20 20-3.5-3.5" />
        </svg>
      </button>
      <button class="icon-btn" type="button" data-cart-toggle aria-expanded="false" aria-controls="cart-drawer"
        aria-label="Open cart">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M6 6h15l-1.5 9h-12z" />
          <path d="M6 6 5 3H2" />
          <circle cx="9" cy="20" r="1" />
          <circle cx="18" cy="20" r="1" />
        </svg>
        <span class="cart-count" data-cart-count aria-hidden="true">0</span>
      </button>
      <button class="icon-btn nav-toggle" type="button" data-nav-toggle aria-expanded="false" aria-controls="site-nav"
        aria-label="Open menu">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 7h16M4 12h16M4 17h16" />
        </svg>
      </button>
    </div>
  </div>

  <div class="header-search" id="header-search">
    <form class="container header-search_form" data-header-search role="search">
      <label class="sr-only" for="header-search-input">Search products</label>
      <input class="header-search_input" id="header-search-input" type="search" name="q"
        placeholder="Search varkey, biscuits, combos…" autocomplete="off">
      <button class="btn btn--primary btn--small" type="submit">Search</button>
    </form>
  </div>
</header>

<!-- Cart drawer (shared across pages) -->
<div class="overlay" data-overlay hidden></div>

<aside class="drawer" id="cart-drawer" role="dialog" aria-modal="true" aria-labelledby="cart-drawer-title"
  aria-hidden="true">
  <div class="drawer_header">
    <h2 class="drawer_title" id="cart-drawer-title">Your Cart</h2>
    <button class="icon-btn" type="button" data-cart-close aria-label="Close cart">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M18 6 6 18M6 6l12 12" />
      </svg>
    </button>
  </div>
  <div class="drawer_body" data-cart-lines>
    <!-- Filled by js/cart.js -->
  </div>
  <div class="drawer_footer">
    <div class="cart-summary">
      <span>Subtotal</span>
      <span class="cart-summary_total" data-cart-subtotal>₹0</span>
    </div>
    <button class="btn btn--whatsapp" type="button" data-order-whatsapp>
      Order on WhatsApp
    </button>
    <p class="cart-note">
      Your order summary opens in WhatsApp — confirm quantity and delivery with us directly.
      <!-- TODO: connect a real payment/checkout service if required later. -->
    </p>
    <p class="sr-only" aria-live="polite" data-cart-live></p>
  </div>
</aside>

<!-- Floating WhatsApp button (appears after scrolling) -->
